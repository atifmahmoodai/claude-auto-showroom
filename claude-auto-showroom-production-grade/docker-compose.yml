# Local / single-server deployment: PostgreSQL + the app.
#   cp .env.example .env   (then edit the passwords)
#   docker compose up -d --build
#   docker compose exec app node dist/cli/create-admin.js --email you@example.com --name "Your Name"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: showroom
      POSTGRES_USER: showroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showroom -d showroom"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://showroom:${POSTGRES_PASSWORD}@db:5432/showroom
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
